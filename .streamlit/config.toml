# GENERATED by design-system/build-ui.js from Ant Design v6 tokens. Edit the generator, not this file.
# Light mode only for now (design-system keeps dark tokens for later).
[browser]
# No usage telemetry (privacy) and nothing written to the home dir (read-only on Vercel).
gatherUsageStats = false

[client]
# Hide Streamlit's developer toolbar (Deploy button, rerun/settings menu) everywhere, not just in production.
toolbarMode = "minimal"
# Visitors never see a traceback: one can carry SQL parameters or the database host. It still goes to the server log.
showErrorDetails = "none"

[server]
# Serves ./static at /app/static (vendored GSAP + landing.js).
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#1f1f1f"  # ink, not Ant blue: checkboxes, focus and radios follow the near-black brand
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#1f1f1f"
linkColor = "#0958d9"
font = "Inter"
codeFont = "JetBrains Mono"
baseFontSize = 16
baseRadius = "none"
buttonRadius = "none"
borderColor = "#8c8c8c"
showWidgetBorder = true
headingFontSizes = ["1.875rem", "1.5rem", "1.25rem", "1rem", "0.875rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
redColor = "#cf1322"
redBackgroundColor = "#fff2f0"
redTextColor = "#cf1322"
orangeColor = "#ad4e00"
orangeBackgroundColor = "#fff7e6"
orangeTextColor = "#ad4e00"
yellowColor = "#874d00"
yellowBackgroundColor = "#fffbe6"
yellowTextColor = "#874d00"
blueColor = "#0958d9"
blueBackgroundColor = "#e6f4ff"
blueTextColor = "#0958d9"
greenColor = "#237804"
greenBackgroundColor = "#f6ffed"
greenTextColor = "#237804"
violetColor = "#722ed1"
violetBackgroundColor = "#f9f0ff"
violetTextColor = "#722ed1"
grayColor = "#595959"
grayBackgroundColor = "#f5f5f5"
grayTextColor = "#595959"

# Inter for text, JetBrains Mono for code and labels (DESIGN.md section 16). Self-hosted, served from ./static.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-wght-normal.woff2"
weight = "100 800"
style = "normal"
